<!doctype html>
<html lang="{{lang}}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!--i18n:redirect-->

    <!--i18n:head-->

    <meta name="application-name" content="{{brand}}" />
    <meta name="apple-mobile-web-app-title" content="{{brand}}" />
    <meta name="theme-color" content="#f4f4f4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
  </head>
  <body>
    <!-- One icon set for the page: 16px grid, 1.5px stroke, square caps. Drawn by .icon in styles.css. -->
    <svg class="sprite" aria-hidden="true">
      <symbol id="i-local" viewBox="0 0 16 16"><path d="M3.5 3.5h9v7h-9zM1.5 12.75h13" /></symbol>
      <symbol id="i-no-upload" viewBox="0 0 16 16"><path d="M8 12.5V5M5 7.5l3-3 3 3M3.5 14.25h9M2.5 2.5l11 11" /></symbol>
      <symbol id="i-no-signup" viewBox="0 0 16 16"><circle cx="8" cy="5" r="2.5" /><path d="M3.5 13.5c.5-2.5 2.2-4 4.5-4s4 1.5 4.5 4M2.5 2.5l11 11" /></symbol>
      <symbol id="i-no-watermark" viewBox="0 0 16 16"><path d="M8 2.25S4.5 6.4 4.5 9.4a3.5 3.5 0 0 0 7 0c0-3-3.5-7.15-3.5-7.15zM2.5 2.5l11 11" /></symbol>
      <symbol id="i-offline" viewBox="0 0 16 16"><path d="M1.75 6.25a9 9 0 0 1 12.5 0M4.1 8.8a5.6 5.6 0 0 1 7.8 0M6.5 11.3a2.1 2.1 0 0 1 3 0M2.5 2.5l11 11" /></symbol>
      <symbol id="i-new" viewBox="0 0 16 16"><path d="M3.5 1.75h6l3 3v9.5h-9zM8 7v5M5.5 9.5h5" /></symbol>
      <symbol id="i-open" viewBox="0 0 16 16"><path d="M1.75 3.25h4.5l1.5 1.5h6.5v8.5H1.75z" /></symbol>
      <symbol id="i-print" viewBox="0 0 16 16"><path d="M4.5 5.25v-3.5h7v3.5M4.5 11.75H1.75v-6.5h12.5v6.5H11.5M4.5 9.25h7v5h-7z" /></symbol>
      <symbol id="i-download" viewBox="0 0 16 16"><path d="M8 2v8.5M4.5 7 8 10.5 11.5 7M2.5 13.75h11" /></symbol>
      <symbol id="i-layout" viewBox="0 0 16 16"><path d="M1.75 4.5h7.5M12.75 4.5h1.5M1.75 11.5h1.5M6.75 11.5h7.5M9.25 3v3h3.5V3zM3.25 10v3h3.5v-3z" /></symbol>
      <symbol id="i-chevron" viewBox="0 0 16 16"><path d="M4.5 6.25 8 9.75l3.5-3.5" /></symbol>
      <symbol id="i-globe" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.25" /><path d="M1.75 8h12.5M8 1.75C6.1 3.55 5.25 5.65 5.25 8S6.1 12.45 8 14.25M8 1.75c1.9 1.8 2.75 3.9 2.75 6.25S9.9 12.45 8 14.25" /></symbol>
      <symbol id="i-expand" viewBox="0 0 16 16"><path d="M2.25 6.25v-4h4M9.75 2.25h4v4M13.75 9.75v4h-4M6.25 13.75h-4v-4" /></symbol>
      <symbol id="i-collapse" viewBox="0 0 16 16"><path d="M6.25 2.25v4h-4M13.75 6.25h-4v-4M9.75 13.75v-4h4M2.25 9.75h4v4" /></symbol>
      <symbol id="i-ok" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.25" /><path d="M5.25 8.25l1.9 1.9 3.6-3.9" /></symbol>
      <symbol id="i-info" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.25" /><path d="M8 7.25v4M8 4.75v.25" /></symbol>
      <symbol id="i-warn" viewBox="0 0 16 16"><path d="M8 1.9 14.6 13.6H1.4zM8 6.25v3.5M8 11.4v.2" /></symbol>
      <symbol id="i-paste" viewBox="0 0 16 16"><path d="M5.5 2.75h-2.75v11.5h10.5V2.75H10.5M5.5 1.75h5v2.5h-5zM5.25 8.25h5.5M5.25 11h3.5" /></symbol>
      <symbol id="i-error" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.25" /><path d="M5.75 5.75l4.5 4.5M10.25 5.75l-4.5 4.5" /></symbol>
      <symbol id="i-check" viewBox="0 0 16 16"><path d="M3 8.5l3.25 3.25L13 5" /></symbol>
    </svg>

    <div class="app">
      <header class="toolbar">
        <a class="brand" href="{{homePath}}">
          <img class="brand-mark" src="/logo-48.png" srcset="/logo-48.png 1x, /logo-96.png 2x" width="24" height="24" alt="" />
          <span class="brand-name"><span class="brand-free">{{brandLead}}</span>{{brandName}}<span class="brand-tld">.com</span></span>
        </a>
        <ul class="privacy" title="{{page.privacyTitle}}">{{privacyItems}}</ul>
        <!--i18n:switcher-->
      </header>

      <div class="intro">
        <!--i18n:intro-->
      </div>

      <div class="tool">
        <div class="actionbar">
          <div class="actions actions-source">
            <span id="stats" class="stats">—</span>
            <button id="settings-toggle" class="disclosure" type="button" title="{{page.layoutTitle}}" aria-expanded="false" aria-controls="settings">
              <svg class="icon" aria-hidden="true"><use href="#i-layout" /></svg>
              <span class="label">{{page.layout}}</span>
            </button>
            <div class="actions-files">
              <button id="new-doc" class="ghost" type="button" title="{{page.newDocTitle}}">
                <svg class="icon" aria-hidden="true"><use href="#i-new" /></svg>
                <span class="label">{{page.newDoc}}</span>
              </button>
              <button id="open-file" class="secondary" type="button" title="{{page.openTitle}}">
                <svg class="icon" aria-hidden="true"><use href="#i-open" /></svg>
                <span class="label">{{page.open}}</span>
              </button>
              <input id="file-input" type="file" accept=".md,.markdown,.txt,text/markdown,text/plain,image/*" multiple hidden />
            </div>
          </div>
          <div class="actions actions-output toolbar-actions">
            <button id="print" class="secondary" type="button" title="{{page.printTitle}}">
              <svg class="icon" aria-hidden="true"><use href="#i-print" /></svg>
              <span id="print-label" class="label">{{ui.print}}</span>
            </button>
            <button id="download" class="primary" type="button" title="{{page.downloadTitle}}">
              <span id="download-label">{{ui.download}}</span>
              <svg class="icon" aria-hidden="true"><use href="#i-download" /></svg>
            </button>
            <button id="fullscreen-toggle" class="ghost icon-only" type="button" aria-pressed="false" title="{{page.fullscreen}}" aria-label="{{page.fullscreen}}">
              <svg class="icon icon-expand" aria-hidden="true"><use href="#i-expand" /></svg>
              <svg class="icon icon-collapse" aria-hidden="true"><use href="#i-collapse" /></svg>
            </button>
          </div>
        </div>

        <div id="settings" class="settings" hidden>
          <label>{{page.template}}
            <select id="opt-template">
              <option value="default">{{page.templateDefault}}</option>
              <option value="report">{{page.templateReport}}</option>
              <option value="academic">{{page.templateAcademic}}</option>
              <option value="resume">{{page.templateResume}}</option>
              <option value="letter">{{page.templateLetter}}</option>
            </select>
          </label>
          <label>{{page.paper}}
            <select id="opt-paper">
              <option value="a4">A4</option>
              <option value="us-letter">Letter</option>
              <option value="a5">A5</option>
              <option value="iso-b5">B5</option>
            </select>
          </label>
          <label>{{page.margin}} <input id="opt-margin" type="number" min="5" max="50" step="1" /> mm</label>
          <label>{{page.fontSize}} <input id="opt-font-size" type="number" min="8" max="18" step="0.5" /> pt</label>
          <label>{{page.lineHeight}} <input id="opt-line-height" type="number" min="1" max="2.4" step="0.1" /></label>
          <label class="check"><input id="opt-page-numbers" type="checkbox" /> {{page.pageNumbers}}</label>
          <label class="check"><input id="opt-toc" type="checkbox" /> {{page.toc}}</label>
          <label class="check"><input id="opt-justify" type="checkbox" /> {{page.justify}}</label>
          <label>{{page.docLanguage}} <select id="opt-lang"></select></label>
          <label class="check"><input id="opt-cover" type="checkbox" /> {{page.cover}}</label>
          <label class="check"><input id="opt-h1-newpage" type="checkbox" /> {{page.h1NewPage}}</label>
          <label title="{{page.bandTitle}}">{{page.header}} <input id="opt-header" type="text" maxlength="200" spellcheck="false" /></label>
          <label title="{{page.bandTitle}}">{{page.footer}} <input id="opt-footer" type="text" maxlength="200" spellcheck="false" /></label>
        </div>

        <div class="view-switch" role="group" aria-label="{{page.viewSwitch}}">
          <button id="show-source" type="button" aria-pressed="true" aria-controls="editor-pane">{{page.source}}</button>
          <button id="show-proof" type="button" aria-pressed="false" aria-controls="preview-pane">{{page.proof}}</button>
        </div>

        <main class="split" data-view="source">
          <section class="editor-pane" id="editor-pane">
            <div class="pane-header">
              <span class="pane-title">{{page.source}} · .md</span>
              <span class="pane-hint">{{page.editorHint}}</span>
            </div>
            <div class="editor-host">
              <div id="empty-state" class="empty-state" hidden>
                <svg class="empty-mark" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 2.75h8.5L19.25 7.5v13.75H6z" /><path d="M14.25 2.75V7.75h5" /><path d="M12.6 11v6.5M9.6 14.5l3 3 3-3" /></svg>
                <p class="empty-title">{{page.emptyTitle}}</p>
                <div class="empty-actions">
                  <button id="empty-paste" class="primary" type="button" title="{{page.pasteTitle}}" hidden>
                    <svg class="icon" aria-hidden="true"><use href="#i-paste" /></svg>
                    <span>{{page.paste}}</span>
                  </button>
                  <button id="empty-open" class="secondary" type="button" title="{{page.openTitle}}">
                    <svg class="icon" aria-hidden="true"><use href="#i-open" /></svg>
                    <span>{{page.open}}</span>
                  </button>
                </div>
              </div>
              <textarea
                id="editor"
                spellcheck="false"
                aria-label="{{page.editorLabel}}"
                placeholder="{{page.editorPlaceholder}}"
              ></textarea>
            </div>
          </section>

          <div class="divider" id="divider" role="separator" aria-orientation="vertical"></div>

          <section class="preview-pane" id="preview-pane" aria-label="{{page.preview}}">
            <div class="pane-header">
              <span class="pane-title">{{page.proof}}</span>
              <span id="paper-hint" class="pane-hint">{{paperHint}}</span>
              <span class="live">{{page.live}}</span>
            </div>
            <div id="scroller" class="scroller" tabindex="0">
              <article id="paper" class="paper"></article>
            </div>
          </section>
        </main>

        <footer class="statusbar">
          <span class="status-left">
            <span id="save-state" class="save-state" hidden></span>
          </span>
          <span id="engine-status" class="engine-status" data-state="idle">
            <span class="dot"></span><span id="engine-text">{{ui.engineIdle}}</span>
          </span>
        </footer>
      </div>

      <div id="warnings" class="warnings" role="status" hidden></div>
    </div>

    <section class="about">
      <!--i18n:about-->
    </section>

    <div id="drop-hint" class="drop-hint" hidden>{{page.dropHint}}</div>

    <!--i18n:data-->
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Page not found · Free MD2PDF</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      :root {
        --ground: #f4f4f3;
        --ink: #141414;
        --ink-2: #3c3c3b;
        --muted: #6e6e6c;
        --rule: #dcdcda;
        --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
        --sans: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Hiragino Sans", "Malgun Gothic", sans-serif;
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root { --ground: #151515; --ink: #ededec; --ink-2: #cfcfcd; --muted: #9a9a98; --rule: #2e2e2d; color-scheme: dark; }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 48px 20px;
        background: var(--ground);
        color: var(--ink);
        font: 16px/1.6 var(--sans);
      }
      main { width: min(560px, 100%); }
      .label { font: 400 11px/1.5 var(--mono); letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); }
      .sheet {
        position: relative;
        margin: 18px 0 28px;
        padding: 36px 32px;
        background: #fff;
        color: #141414;
        border: 1px solid #dcdcda;
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.08);
      }
      h1 { margin: 0 0 8px; font-size: 30px; line-height: 1.2; letter-spacing: -0.02em; }
      .sheet p { margin: 0; color: #3c3c3b; }
      a.home {
        display: inline-block;
        margin-top: 22px;
        padding: 11px 18px;
        background: #141414;
        color: #fff;
        font: 500 12px/1 var(--mono);
        letter-spacing: 0.08em;
        text-decoration: none;
      }
      a.home:hover { background: #3c3c3b; }
      nav { display: flex; flex-wrap: wrap; gap: 6px 18px; border-top: 1px solid var(--rule); padding-top: 16px; }
      nav a { color: var(--ink-2); font: 400 12px/1.6 var(--mono); letter-spacing: 0.06em; text-decoration: none; }
      nav a:hover { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <span class="label">Free MD2PDF · 404</span>
      <div class="sheet">
        <h1>This page isn’t in print.</h1>
        <p>The address may be mistyped, or the page has moved. The converter itself is one click away.</p>
        <a class="home" href="/">Open Free MD2PDF ↵</a>
      </div>
      <nav aria-label="Languages">
        <a href="/" hreflang="en">English</a>
        <a href="/zh/" hreflang="zh" lang="zh-CN">简体中文</a>
        <a href="/ja/" hreflang="ja" lang="ja">日本語</a>
        <a href="/ko/" hreflang="ko" lang="ko">한국어</a>
        <a href="/es/" hreflang="es" lang="es">Español</a>
        <a href="/pt/" hreflang="pt" lang="pt-BR">Português</a>
        <a href="/fr/" hreflang="fr" lang="fr">Français</a>
        <a href="/de/" hreflang="de" lang="de">Deutsch</a>
        <a href="/ru/" hreflang="ru" lang="ru">Русский</a>
      </nav>
    </main>
  </body>
</html>
